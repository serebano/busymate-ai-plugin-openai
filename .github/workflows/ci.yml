name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    # Our ephemeral k3s runner (scale set ci-plugin-openai); never GitHub-hosted (owner order 2026-11-04).
    runs-on: ci-plugin-openai
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: No GitHub-hosted runners (runs-on lint)
        run: python3 .github/runs-on-lint.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: openai-plugin-package
          path: dist/*.zip
  # Runs only when the reviewer-account token is configured, so a missing
  # secret shows up as a skipped job, not a green scan.
  scan-live:
    if: ${{ vars.SCAN_LIVE == 'true' }}
    # Our ephemeral k3s runner (scale set ci-plugin-openai); never GitHub-hosted (owner order 2026-11-04).
    runs-on: ci-plugin-openai
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/scan-live.mjs
        env:
          BUSYMATE_MCP_TOKEN: ${{ secrets.BUSYMATE_MCP_TOKEN }}
