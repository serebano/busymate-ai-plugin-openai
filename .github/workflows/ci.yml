name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: openai-plugin-package
          path: dist/*.zip
  # Runs only when the reviewer-account token is configured, so a missing
  # secret shows up as a skipped job, not a green scan.
  scan-live:
    if: ${{ vars.SCAN_LIVE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/scan-live.mjs
        env:
          BUSYMATE_MCP_TOKEN: ${{ secrets.BUSYMATE_MCP_TOKEN }}
